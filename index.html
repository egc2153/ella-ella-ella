<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anscombe's Quartet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
  
  #chart {
    display: grid;
    grid-template-columns: repeat(2, 500px);
    gap: 20px;
    justify-content: center;
  }
  
  .panel {
    text-align: left;
    padding: 12px;
    border-radius: 36px;
    box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
  }

  .label {
    margin-left: 16px;  
    margin-bottom: 0px;
    margin-top: 10px;
    font-weight: bold;
    display: block;
    font-size: 20px;
   }
  </style>
</head>

<body>

  <div id="chart"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
